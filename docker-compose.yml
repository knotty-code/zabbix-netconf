# Zabbix lab stack — native NETCONF (SSH subsystem) for SR Linux.
# Web UI: http://localhost:8080  (Admin / zabbix)
#
# Requires Zabbix ≥ 7.2 (subsystem parameter on SSH items).
# Deploy the two-node lab first so the srl-lab network exists:
#   sudo containerlab deploy -t lab/srl.clab.yml
#   docker compose up -d
#   python3 scripts/zabbix_register_hosts.py --url http://localhost:8080
# Stop:   docker compose down
#
# Note: upgrading major Zabbix images against an old Postgres volume auto-migrates
# schema on server start. If the UI fails after a major jump, recreate the volume:
#   docker compose down -v && docker compose up -d

name: zabbix-netconf

services:
  postgres:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - zabbix-net

  zabbix-server:
    # 7.2+ required for ssh.run[...,netconf]; use current 7.4 line
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      ZBX_STARTPOLLERS: "5"
      ZBX_STARTTRAPPERS: "3"
      # SSH agent pollers — required for native NETCONF subsystem items
      ZBX_STARTSSH: "5"
      # Global Timeout (seconds, 1–30). NETCONF hello+RPC needs more than default 3s.
      ZBX_TIMEOUT: "30"
      ZBX_CACHESIZE: 128M
      ZBX_STARTVMWARECOLLECTORS: "0"
    volumes:
      - ./externalchecks:/usr/lib/zabbix/externalscripts:ro
      - ./scripts:/scripts:ro
    ports:
      - "10051:10051"
    extra_hosts:
      - "srl1:172.30.50.11"
      - "srl2:172.30.50.12"
    networks:
      - zabbix-net
      - srl-lab

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
      - postgres
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    ports:
      - "8080:8080"
    networks:
      - zabbix-net

  # Optional offline tools (ncclient probes only — not in the data path)
  netconf-tools:
    image: python:3.12-slim
    container_name: zabbix-netconf-tools
    profiles: ["tools"]
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
    command: >
      bash -c "pip install --no-cache-dir -q ncclient lxml paramiko &&
               sleep infinity"
    extra_hosts:
      - "srl1:172.30.50.11"
      - "srl2:172.30.50.12"
    networks:
      - zabbix-net
      - srl-lab

networks:
  zabbix-net:
    driver: bridge
  # containerlab management network (created by `containerlab deploy`)
  srl-lab:
    external: true
    name: srl-lab

volumes:
  zabbix-postgres-data:
